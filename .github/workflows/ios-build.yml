name: Bizgrowth360 iOS Dynamic Build

# Phase 7: isolated, configuration-driven iOS builds on a macOS runner.
# workflow_dispatch only: macOS runners consume significantly more GitHub
# Actions minutes than Linux runners, so builds are never triggered on push.
#
# Signing material is supplied exclusively through GitHub Actions secrets and
# is removed from the runner in the always() cleanup step. No certificate,
# private key, password or provisioning profile is ever written to the
# repository, the WordPress database, logs or build artifacts.

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: false
        type: string
        default: 'Demo Website App'
      package_id:
        description: 'Android Package ID (shared configuration)'
        required: false
        type: string
        default: 'in.bizgrowth360.demoapp'
      ios_bundle_id:
        description: 'iOS Bundle Identifier (e.g. in.bizgrowth360.mybusiness)'
        required: false
        type: string
        default: ''
      website_url:
        description: 'Website URL loaded inside the app (HTTPS only)'
        required: false
        type: string
        default: 'https://example.com'
      version_name:
        description: 'Version Name (CFBundleShortVersionString, e.g. 1.0.0)'
        required: false
        type: string
        default: '1.0.0'
      version_code:
        description: 'Build Number (CFBundleVersion, integer >= 1)'
        required: false
        type: number
        default: 1
      ios_team_id:
        description: 'Apple Developer Team ID (optional; IOS_TEAM_ID secret is used when empty)'
        required: false
        type: string
        default: ''
      ios_export_method:
        description: 'Export Method'
        required: true
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
        default: 'app-store'
      ios_mode:
        description: 'Build Mode (validation compiles for the Simulator and never claims an IPA)'
        required: true
        type: choice
        options:
          - ipa
          - validation
        default: 'ipa'
      upload_to_testflight:
        description: 'Upload the signed IPA to TestFlight after a successful build'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
      confirm_app_store_upload:
        description: 'Explicit confirmation for TestFlight upload (must be true together with upload_to_testflight)'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
      macos_runner:
        description: 'macOS runner (macOS minutes are billed at a higher rate)'
        required: true
        type: choice
        options:
          - macos-14
          - macos-15
        default: 'macos-14'
      orientation:
        description: 'Screen Orientation'
        required: true
        type: choice
        options:
          - portrait
          - landscape
          - auto
          - sensor
        default: 'portrait'
      primary_color:
        description: 'Primary Color (#RRGGBB)'
        required: false
        type: string
        default: '#2563EB'
      background_color:
        description: 'Background Color (#RRGGBB)'
        required: false
        type: string
        default: '#FFFFFF'
      splash_background_color:
        description: 'Splash Background Color (#RRGGBB, optional)'
        required: false
        type: string
        default: ''
      icon_url:
        description: 'HTTPS URL to a custom icon (PNG/JPEG/WebP, >= 192x192, <= 10 MB)'
        required: false
        type: string
        default: ''
      splash_url:
        description: 'HTTPS URL to a custom splash image (PNG/JPEG/WebP, >= 320x320, <= 10 MB)'
        required: false
        type: string
        default: ''
      allow_external_links:
        description: 'Open non-site links in the system browser'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      enable_status_bar:
        description: 'Show the iOS status bar'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      config_file:
        description: 'Path to a JSON configuration file (optional; inputs override it)'
        required: false
        type: string
        default: 'config/default-app.json'
      design_json:
        description: 'App Design Studio JSON payload (normally sent by the WordPress plugin)'
        required: false
        type: string
        default: ''
      features_json:
        description: 'Native App Features JSON payload (normally sent by the WordPress plugin)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-ios:
    name: Dynamic iOS Build (${{ inputs.ios_mode }}/${{ inputs.ios_export_method }})
    runs-on: ${{ inputs.macos_runner || 'macos-14' }}
    timeout-minutes: 45
    concurrency:
      group: bizgrowth360-ios-${{ github.ref }}-${{ inputs.app_name || 'default' }}
      cancel-in-progress: false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Toolchain
        run: |
          set -euo pipefail
          for candidate in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode_16.1.app Xcode_16.0.app; do
            if [ -d "/Applications/$candidate" ]; then
              sudo xcode-select -s "/Applications/$candidate"
              break
            fi
          done
          xcodebuild -version
          echo "Selected developer directory: $(xcode-select -p)"

      - name: Verify macOS Build Tooling
        run: |
          node --version
          npm --version
          pod --version || true
          xcrun --find altool >/dev/null 2>&1 && echo "altool available" || echo "altool not available"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install App Template Dependencies
        run: |
          cd app-template
          npm ci

      - name: Install CocoaPods if Missing
        run: |
          set -euo pipefail
          if command -v pod >/dev/null 2>&1; then
            pod --version
          else
            gem install cocoapods --no-document
            pod --version
          fi

      - name: Cache CocoaPods Downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('app-template/ios/App/Podfile', 'app-template/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Import Apple Signing Identity and Provisioning Profile
        if: ${{ inputs.ios_mode != 'validation' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${IOS_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::IOS_CERTIFICATE_BASE64 is required for a signed IPA. Configure Apple signing secrets or run ios_mode=validation."
            exit 1
          fi
          if [ -z "${IOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::IOS_CERTIFICATE_PASSWORD is required."
            exit 1
          fi

          KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/signing-certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | openssl base64 -d -A > "$CERT_PATH"
          chmod 600 "$CERT_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Eq "Apple|iPhone"; then
            echo "::error::No valid Apple code-signing identity was imported. Verify IOS_CERTIFICATE_BASE64 and its password."
            exit 1
          fi

          rm -f "$CERT_PATH"
          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          if [ -z "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is required for a signed IPA."
            exit 1
          fi

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          DECODED_PLIST="$RUNNER_TEMP/profile.plist"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | openssl base64 -d -A > "$PROFILE_PATH"
          chmod 600 "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$DECODED_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$DECODED_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$DECODED_PLIST")

          if [ -z "$PROFILE_UUID" ] || [ -z "$PROFILE_NAME" ]; then
            echo "::error::Could not read UUID/Name from the provisioning profile."
            exit 1
          fi

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          rm -f "$PROFILE_PATH" "$DECODED_PLIST"
          {
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
            echo "IOS_PROFILE_UUID=$PROFILE_UUID"
          } >> "$GITHUB_ENV"

          echo "Imported a valid Apple signing identity and provisioning profile."

      - name: Prepare App Store Connect API Key
        if: ${{ inputs.ios_mode != 'validation' && inputs.upload_to_testflight == 'true' && inputs.confirm_app_store_upload == 'true' }}
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${APPSTORE_CONNECT_KEY_ID:-}" ] || [ -z "${APPSTORE_CONNECT_ISSUER_ID:-}" ] || [ -z "${APPSTORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "::error::TestFlight upload was requested but APPSTORE_CONNECT_KEY_ID, APPSTORE_CONNECT_ISSUER_ID or APPSTORE_CONNECT_PRIVATE_KEY is missing."
            exit 1
          fi

          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"

          if printf '%s' "$APPSTORE_CONNECT_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPSTORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APPSTORE_CONNECT_PRIVATE_KEY" | openssl base64 -d -A > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"

          if ! openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>&1; then
            echo "::error::The App Store Connect private key is not a valid .p8 key."
            rm -f "$KEY_PATH"
            exit 1
          fi

          {
            echo "ASC_KEY_PATH=$KEY_PATH"
            echo "APPSTORE_CONNECT_KEY_ID=$APPSTORE_CONNECT_KEY_ID"
            echo "APPSTORE_CONNECT_ISSUER_ID=$APPSTORE_CONNECT_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build Dynamic iOS Application
        id: build
        env:
          CONFIG_FILE: ${{ inputs.config_file || 'config/default-app.json' }}
          APP_NAME: ${{ inputs.app_name || '' }}
          PACKAGE_ID: ${{ inputs.package_id || '' }}
          IOS_BUNDLE_ID: ${{ inputs.ios_bundle_id || '' }}
          WEBSITE_URL: ${{ inputs.website_url || '' }}
          VERSION_NAME: ${{ inputs.version_name || '' }}
          VERSION_CODE: ${{ inputs.version_code || '' }}
          IOS_TEAM_ID: ${{ inputs.ios_team_id || secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ inputs.ios_export_method }}
          IOS_MODE: ${{ inputs.ios_mode }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          CONFIRM_APP_STORE_UPLOAD: ${{ inputs.confirm_app_store_upload }}
          IOS_APS_ENVIRONMENT: ${{ inputs.ios_export_method == 'development' && 'development' || 'production' }}
          ORIENTATION: ${{ inputs.orientation || '' }}
          PRIMARY_COLOR: ${{ inputs.primary_color || '' }}
          BACKGROUND_COLOR: ${{ inputs.background_color || '' }}
          SPLASH_BACKGROUND_COLOR: ${{ inputs.splash_background_color || '' }}
          ICON_URL: ${{ inputs.icon_url || '' }}
          SPLASH_URL: ${{ inputs.splash_url || '' }}
          ALLOW_EXTERNAL_LINKS: ${{ inputs.allow_external_links || '' }}
          ENABLE_STATUS_BAR: ${{ inputs.enable_status_bar || '' }}
          DESIGN_JSON: ${{ inputs.design_json || '' }}
          FEATURES_JSON: ${{ inputs.features_json || '' }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/build-ios.js --config "$CONFIG_FILE"

      - name: Upload iOS IPA Artifact
        if: success() && steps.build.outputs.ipa_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.ipa_artifact_name }}
          path: ${{ steps.build.outputs.ipa_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload iOS Build Logs and Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/ios-builds/**/build.log
            dist/ios-builds/**/build-summary.json
            dist/ios-builds/**/build-summary.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Secure Cleanup of Signing Material
        if: always()
        run: |
          set +e
          if [ -f "${RUNNER_TEMP:-/nonexistent}/app-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys"
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/signing-certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          echo "Temporary signing material removed."

      - name: Fallback iOS Build Summary
        if: always()
        env:
          REQUESTED_APP: ${{ inputs.app_name || 'config default' }}
          REQUESTED_BUNDLE: ${{ inputs.ios_bundle_id || 'config default' }}
        run: |
          SUMMARY_DIR="${{ steps.build.outputs.ios_output_dir }}"
          if [ -z "$SUMMARY_DIR" ] || [ ! -f "$SUMMARY_DIR/build-summary.md" ]; then
            {
              echo "## Bizgrowth360 iOS Build"
              echo ""
              echo "| Property | Value |"
              echo "| :--- | :--- |"
              echo "| **Build Status** | **${{ job.status }}** |"
              echo "| **Requested App** | \`$REQUESTED_APP\` |"
              echo "| **Requested Bundle ID** | \`$REQUESTED_BUNDLE\` |"
              echo "| **Mode** | \`${{ inputs.ios_mode }}\` |"
              echo ""
              echo "The build failed before a detailed summary could be written. See the job logs and the **ios-build-logs** artifact."
              echo ""
              echo "> iOS builds use macOS GitHub-hosted runners and may incur GitHub Actions macOS usage costs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
