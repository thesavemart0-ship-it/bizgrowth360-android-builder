name: Bizgrowth360 Android Dynamic Build

# Phase 3: isolated, configuration-driven Android builds.
# Each run gets its own workspace; the base app-template is never modified.

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: false
        type: string
        default: 'Demo Website App'
      package_id:
        description: 'Android Package ID (e.g. in.bizgrowth360.mybusiness)'
        required: false
        type: string
        default: 'in.bizgrowth360.demoapp'
      website_url:
        description: 'Website URL loaded inside the app (HTTPS only)'
        required: false
        type: string
        default: 'https://example.com'
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: false
        type: string
        default: '1.0.0'
      version_code:
        description: 'Version Code (positive integer >= 1)'
        required: false
        type: number
        default: 1
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        options:
          - both
          - apk
          - aab
        default: 'both'
      build_variant:
        description: 'Build Variant'
        required: true
        type: choice
        options:
          - release
          - debug
        default: 'release'
      orientation:
        description: 'Screen Orientation'
        required: true
        type: choice
        options:
          - portrait
          - landscape
          - auto
          - sensor
        default: 'portrait'
      primary_color:
        description: 'Primary Color (#RRGGBB)'
        required: false
        type: string
        default: '#2563EB'
      background_color:
        description: 'Background Color (#RRGGBB)'
        required: false
        type: string
        default: '#FFFFFF'
      splash_background_color:
        description: 'Splash Background Color (#RRGGBB, optional)'
        required: false
        type: string
        default: ''
      icon_url:
        description: 'HTTPS URL to a custom icon (PNG/JPEG/WebP, >= 192x192, <= 10 MB)'
        required: false
        type: string
        default: ''
      splash_url:
        description: 'HTTPS URL to a custom splash image (PNG/JPEG/WebP, >= 320x320, <= 10 MB)'
        required: false
        type: string
        default: ''
      allow_external_links:
        description: 'Open non-site links in the system browser'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      enable_status_bar:
        description: 'Show the Android status bar'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      config_file:
        description: 'Path to a JSON configuration file (optional; inputs override it)'
        required: false
        type: string
        default: 'config/default-app.json'

  push:
    branches:
      - main
    paths:
      - 'app-template/**'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Dynamic Android Build (${{ inputs.build_type || 'both' }}/${{ inputs.build_variant || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('app-template/android/gradle/wrapper/gradle-wrapper.properties', 'app-template/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Root Dependencies
        run: npm ci

      - name: Install App Template Dependencies
        run: |
          cd app-template
          npm ci

      - name: Configure Release Signing Keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -n "$KEYSTORE_PASSWORD" ]; then echo "::add-mask::$KEYSTORE_PASSWORD"; fi
            if [ -n "$KEY_PASSWORD" ]; then echo "::add-mask::$KEY_PASSWORD"; fi
            if [ -n "$KEY_ALIAS" ]; then echo "::add-mask::$KEY_ALIAS"; fi

            KEYSTORE_DIR="$RUNNER_TEMP/keystore"
            mkdir -p "$KEYSTORE_DIR"
            chmod 700 "$KEYSTORE_DIR"
            KEYSTORE_FILE="$KEYSTORE_DIR/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

            if [ ! -s "$KEYSTORE_FILE" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
              exit 1
            fi

            {
              echo "KEYSTORE_FILE=$KEYSTORE_FILE"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Production keystore decoded successfully."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret configured. Release artifacts will be debug-signed."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Dynamic Android Application
        id: build
        env:
          CONFIG_FILE: ${{ inputs.config_file || 'config/default-app.json' }}
          APP_NAME: ${{ inputs.app_name || '' }}
          PACKAGE_ID: ${{ inputs.package_id || '' }}
          WEBSITE_URL: ${{ inputs.website_url || '' }}
          VERSION_NAME: ${{ inputs.version_name || '' }}
          VERSION_CODE: ${{ inputs.version_code || '' }}
          BUILD_TYPE: ${{ inputs.build_type || '' }}
          BUILD_VARIANT: ${{ inputs.build_variant || '' }}
          ORIENTATION: ${{ inputs.orientation || '' }}
          PRIMARY_COLOR: ${{ inputs.primary_color || '' }}
          BACKGROUND_COLOR: ${{ inputs.background_color || '' }}
          SPLASH_BACKGROUND_COLOR: ${{ inputs.splash_background_color || '' }}
          ICON_URL: ${{ inputs.icon_url || '' }}
          SPLASH_URL: ${{ inputs.splash_url || '' }}
          ALLOW_EXTERNAL_LINKS: ${{ inputs.allow_external_links || '' }}
          ENABLE_STATUS_BAR: ${{ inputs.enable_status_bar || '' }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/build-app.js --config "$CONFIG_FILE"

      - name: Upload APK Build Artifact
        if: success() && steps.build.outputs.apk_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk_artifact_name }}
          path: ${{ steps.build.outputs.apk_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB Build Artifact
        if: success() && steps.build.outputs.aab_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.aab_artifact_name }}
          path: ${{ steps.build.outputs.aab_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/builds/**/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Secure Cleanup of Sensitive Keystore Files
        if: always()
        run: |
          if [ -n "$RUNNER_TEMP" ] && [ -d "$RUNNER_TEMP/keystore" ]; then
            rm -rf "$RUNNER_TEMP/keystore"
            echo "Temporary keystore files removed."
          fi

      - name: Fallback Build Summary
        if: always()
        env:
          REQUESTED_APP: ${{ inputs.app_name || 'config default' }}
          REQUESTED_PACKAGE: ${{ inputs.package_id || 'config default' }}
        run: |
          SUMMARY_DIR="${{ steps.build.outputs.output_dir }}"
          if [ -z "$SUMMARY_DIR" ] || [ ! -f "$SUMMARY_DIR/build-summary.md" ]; then
            {
              echo "## Bizgrowth360 Android Dynamic Build"
              echo ""
              echo "| Property | Value |"
              echo "| :--- | :--- |"
              echo "| **Build Status** | **${{ job.status }}** |"
              echo "| **Requested App** | \`$REQUESTED_APP\` |"
              echo "| **Requested Package** | \`$REQUESTED_PACKAGE\` |"
              echo ""
              echo "The build failed before a detailed summary could be written. See the job logs and the **build-logs** artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
