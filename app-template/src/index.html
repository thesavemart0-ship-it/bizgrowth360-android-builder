<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#2563EB">
  <title>Demo Website App</title>
  <link rel="stylesheet" href="app.css">
  <style>
    /* Critical inline CSS to prevent any white flash or blank screen */
    :root {
      --primary-color: #2563EB;
      --bg-color: #FFFFFF;
      --text-color: #1F2937;
      --text-muted: #6B7280;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    [hidden] { display: none !important; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 20px) + 16px) 24px calc(env(safe-area-inset-bottom, 20px) + 16px);
      text-align: center;
      overflow: hidden;
      user-select: none;
    }
    body.bg360-shell-active {
      display: block;
      padding: 0;
      overflow: hidden;
      background: var(--bg360-bg, #FFFFFF);
      color: var(--bg360-text, #111827);
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="app-container" id="bg360-legacy-shell">
    <!-- Brand / Logo Section -->
    <div class="brand-section">
      <div class="logo-wrapper">
        <svg class="app-icon-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" rx="24" fill="var(--primary-color)" />
          <path d="M30 70V30L55 50L30 70Z" fill="#FFFFFF" fill-opacity="0.9" />
          <path d="M50 30L75 50L50 70V30Z" fill="#FFFFFF" />
          <circle cx="50" cy="50" r="10" fill="var(--primary-color)" />
        </svg>
      </div>
      <h1 id="app-title" class="app-title">Demo Website App</h1>
      <p id="app-subtitle" class="app-subtitle">Connecting to your experience...</p>
    </div>

    <!-- State 1: Loading Indicator -->
    <div id="loading-state" class="state-container visible">
      <div class="spinner-wrapper">
        <div class="spinner"></div>
      </div>
      <p id="loading-status" class="status-text">Loading website...</p>
    </div>

    <!-- State 2: Offline / Error Screen -->
    <div id="error-state" class="state-container hidden">
      <div class="error-icon-wrapper">
        <svg class="error-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h2 class="error-title">No Internet Connection</h2>
      <p class="error-description">
        We could not reach the server. Please verify your mobile data or Wi-Fi connection and tap below to retry.
      </p>

      <div class="error-meta" id="error-details">
        <span class="meta-label">Target:</span>
        <span class="meta-url" id="target-url-label">https://example.com</span>
      </div>

      <button id="retry-btn" class="retry-button" type="button">
        <span class="btn-text">Retry Connection</span>
        <span class="btn-spinner hidden"></span>
      </button>
    </div>
  </div>

  <div id="bg360-app-shell" class="bg360-shell" hidden></div>

  <script src="app-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
